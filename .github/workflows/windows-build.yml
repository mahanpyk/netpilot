name: Windows test build

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-parity

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Resolve dependencies
        shell: pwsh
        run: flutter pub get

      - name: Analyze
        shell: pwsh
        run: flutter analyze

      - name: Run Flutter tests
        shell: pwsh
        run: flutter test

      - name: Build Windows application and native service
        shell: pwsh
        run: flutter build windows --release

      - name: Run native protocol tests
        shell: pwsh
        run: ctest --test-dir build/windows/x64 -C Release --output-on-failure

      - name: Locate Windows driver tools
        id: tools
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe |
            Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild was not found.' }

          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $inf2cat = Get-ChildItem $kits -Filter inf2cat.exe -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          $signtool = Get-ChildItem $kits -Filter signtool.exe -Recurse |
            Where-Object FullName -Match '\\x64\\' |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $inf2cat -or -not $signtool) {
            throw 'WDK tools (Inf2Cat/SignTool) were not found on the runner.'
          }

          "msbuild=$msbuild" >> $env:GITHUB_OUTPUT
          "inf2cat=$($inf2cat.FullName)" >> $env:GITHUB_OUTPUT
          "signtool=$($signtool.FullName)" >> $env:GITHUB_OUTPUT

      - name: Build and test-sign WFP driver
        shell: pwsh
        timeout-minutes: 8
        run: |
          $driverOut = Join-Path $PWD 'build\windows\driver\Release'
          New-Item -ItemType Directory -Force $driverOut | Out-Null
          $driverLog = Join-Path $env:RUNNER_TEMP 'netpilot-driver-build.log'
          & '${{ steps.tools.outputs.msbuild }}' windows\native\driver\NetPilotWfp.vcxproj `
            /m /p:Configuration=Release /p:Platform=x64 /p:OutDir="$driverOut\" `
            /p:SignMode=Off 2>&1 | Tee-Object -FilePath $driverLog
          $driverExitCode = $LASTEXITCODE
          if ($driverExitCode -ne 0) {
            Get-Content $driverLog | Select-String -Pattern 'error |fatal error|failed' |
              Select-Object -Last 12 | ForEach-Object { Write-Host "::error::$($_.Line)" }
            throw "Driver build failed with exit code $driverExitCode."
          }

          Copy-Item windows\native\driver\NetPilotWfp.inf $driverOut -Force

          $catalogLog = Join-Path $env:RUNNER_TEMP 'netpilot-inf2cat.log'
          & '${{ steps.tools.outputs.inf2cat }}' /driver:$driverOut /os:10_X64 `
            2>&1 | Tee-Object -FilePath $catalogLog
          $catalogExitCode = $LASTEXITCODE
          if ($catalogExitCode -ne 0) {
            Get-Content $catalogLog | Select-String -Pattern 'error|fatal|failed' |
              Select-Object -Last 12 | ForEach-Object { Write-Host "::error::$($_.Line)" }
            throw "Inf2Cat failed with exit code $catalogExitCode."
          }

          Write-Host 'Creating ephemeral driver test certificate...'
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject 'CN=NetPilot Driver Test' -CertStoreLocation Cert:\CurrentUser\My
          $publicCertificate = Join-Path $driverOut 'NetPilotDriverTest.cer'
          Export-Certificate -Cert $certificate -FilePath $publicCertificate -Force | Out-Null
          Write-Host 'Signing and verifying the driver files...'
          Get-ChildItem $driverOut -Include *.sys,*.cat -Recurse | ForEach-Object {
            & '${{ steps.tools.outputs.signtool }}' sign /fd sha256 /sha1 $certificate.Thumbprint /v $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing $($_.Name) failed." }
            $signature = Get-AuthenticodeSignature -FilePath $_.FullName
            if (-not $signature.SignerCertificate -or
                $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint -or
                $signature.Status -eq 'HashMismatch') {
              throw "Signature inspection for $($_.Name) failed: $($signature.Status)."
            }
            Write-Host "Signed $($_.Name): $($signature.Status) (test certificate is untrusted on CI)."
          }

          $destination = Join-Path $PWD 'build\windows\x64\runner\Release\driver'
          New-Item -ItemType Directory -Force $destination | Out-Null
          Copy-Item "$driverOut\NetPilotWfp.*" $destination -Force
          Copy-Item $publicCertificate $destination -Force

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          wix extension add WixToolset.Bal.wixext/4.0.6 --global

      - name: Build MSI and bootstrapper
        shell: pwsh
        run: .\windows\installer\build.ps1 -Configuration Release

      - name: Create portable archive
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath windows\installer\out\NetPilot-windows-x64-portable.zip -Force

      - name: Stage release assets
        shell: pwsh
        run: |
          $assets = Join-Path $PWD 'build\windows\release-assets'
          New-Item -ItemType Directory -Force $assets | Out-Null
          Copy-Item windows\installer\out\NetPilotSetup.exe $assets
          Copy-Item windows\installer\out\NetPilot.msi $assets
          Copy-Item windows\installer\out\NetPilot-windows-x64-portable.zip $assets
          Copy-Item build\windows\x64\runner\Release\driver\NetPilotDriverTest.cer $assets

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetPilot-windows-x64-test
          if-no-files-found: error
          retention-days: 14
          path: build/windows/release-assets/*
